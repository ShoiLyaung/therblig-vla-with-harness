scenario_id: A05
revision: 草案一
tier: A
title: 把壶中液体倒入杯内
baseline_refs:
  root: 67c066d
  harness: ed2eb4b
  provider: 99b37bf
  catalog: 0.2.0
  body_profile: g1-inspire@3
goal: 从已标识的壶向目标杯倾倒，到达目标液位后将壶放回
success_definition: 杯内液位符合目标标准、无可见溢出、壶直立且有支撑
authorization:
  status: 当前本体未授权
  scope: 倾倒时液位、溢出及偏载包络；普通站姿壶柄获取单独审查
  reason: 没有已发布的倾倒卡、液位验证路径及批准的偏载包络
  would_authorize: 取得液位与溢出证据标准、匹配载荷工况及倾倒变体审批
  provenance: [DATASHEET_DECLARED, NEEDS_VALIDATION, THIRD_PARTY_MEASURED, UNCALIBRATED]
ambiguity: 倾壶使液体转移标 U；倾倒前对准杯口才是 P。减轻的轴向载荷不能独立证明液体进入目标杯
phases:
- id: plan
  goal: 将倒水目标展开为具体验证点
  capability: s2.expand
  s0_modes: BALANCE
  verification: 目标杯与液位标准已绑定
  monitor_need: MR-06
  authorization: 条件授权
  codes: [PN]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 仅目标分解
- id: pick
  goal: 获取壶柄
  capability: acquire_object
  s0_modes: hand.acquire_slow
  verification: 壶柄身份与接触分别确认
  monitor_need: MR-05
  authorization: 条件授权
  codes: [G]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 静态获取壶柄，须核对工况
- id: carry
  goal: 载壶到杯口上方
  capability: move_payload
  s0_modes: RETENTION
  verification: 壶体到达且路径清空
  monitor_need: MR-03
  authorization: 条件授权
  codes: [TL, H]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 站姿且偏载仍在既有搬运包络内
- id: transfer
  goal: 递归展开杯口对准、倾倒及回正
  capability: s2.expand
  s0_modes: BALANCE
  verification: 液位标准、杯口与壶嘴已绑定
  monitor_need: MR-06
  authorization: 条件授权
  codes: [PN, H]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 仅图展开并保持已核准的壶柄令牌
- id: align
  goal: 对准当前杯口
  capability: align_for_use
  s0_modes: COMPLIANCE
  verification: 壶嘴与杯口关系合格
  monitor_need: MR-03
  authorization: 条件授权
  codes: [P, H]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 仅静态杯口定位、对位；不授权倾倒
- id: pour
  goal: 控制倾角与回正
  capability: pour_liquid
  s0_modes: RETENTION、COMPLIANCE
  verification: 液位与溢出分别验证
  monitor_need: MR-06
  authorization: 当前本体未授权
  codes: [U, H]
  coverage: 需要但被阻塞
  fault_refs: [F05, F05b]
  authorization_note: 液位与溢出分别验证
- id: restage
  goal: 将回正的壶预置于原支撑区
  capability: stage_for_next_use
  s0_modes: RETENTION
  verification: 流已停止，壶底与支撑区域已对准
  monitor_need: MR-05
  authorization: 条件授权
  codes: [PP, H]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 已回正且停止流动的条件下预置；本任务实际前驱倾倒受阻
- id: rest
  goal: 确认支撑后卸载
  capability: release_to_support
  s0_modes: COMPLIANCE
  verification: 壶直立、受支撑且手已脱离
  monitor_need: MR-05
  authorization: 条件授权
  codes: [RL]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 独立证实支撑后接管；本任务实际前驱倾倒受阻
faults:
- id: F05
  at_boundary: pour
  injection: 壶嘴遮住液面且托盘出现液滴
  expected_records: [S1 保留姿态及观测来源, Verifier 将目标液位谓词记 UNKNOWN；尚未证实托盘液滴越界]
  ordering: [确认安全停止倾倒先于换视角, 补证后再决定是否继续]
  forbidden_outcomes: [凭壶重量下降提交达标, 盲目追加倾倒]
- id: F05b
  at_boundary: pour
  injection: 独立托盘观测证实溢出越界，目标液面仍被遮挡
  expected_records: [液位谓词 UNKNOWN, 无越界溢出谓词 FALSE, 本段 effect_holds 为 FALSE，verdict 为 FAILED]
  ordering: [取得越界反证先于失败判定]
  forbidden_outcomes: [以一个未知液位谓词覆盖已证实的反证]
monitor_needs:
- mr: MR-03
  concern: 倾角偏离批准包络
  evidence: 壶体姿态、杯口几何
  d9: generic/motion_envelope@1
  maximum: SLOW
- mr: MR-05
  concern: 握持滑移与正常减载混淆
  evidence: 指位、相对运动与载荷趋势
  d9: generic/contact_force_envelope@1
  maximum: SOFT_HOLD
- mr: MR-06
  concern: 液体溢出
  evidence: 不同新帧的溢出证据，逐项批准的视觉持续策略
  d9: generic/people_workspace@1
  maximum: SOFT_HOLD
- mr: MR-01
  concern: 独立基线核验跌倒、碰撞或危险闯入
  evidence: 合格的本体／世界证据与 S0 实际保护回执
  d9: baseline/fall@1（其他危险依部署登记的基线硬规则）
  maximum: STOP_LATCHED
- mr: MR-02
  concern: 对象锚点、参考图像与当前接近对象不符
  evidence: 独立的实例定位与当前运动方向
  d9: generic/target_identity@1
  maximum: SOFT_HOLD
- mr: MR-04
  concern: 支撑或载荷改变后姿态不稳
  evidence: 独立合格的惯性与支撑证据
  d9: generic/posture_balance@1
  maximum: STOP_LATCHED
gap_refs: [M02, C01, M01]
