extends_walkthrough: 独立用例
dag:
  nodes:
  - id: plan
    phase: plan
    gate: 任务修订、目标杯与液位标准已确认
    composition: EXPANDABLE
    depends_on: []
    parallel_group: 无
    parent: 无
  - id: pick
    phase: pick
    gate: 壶柄身份、握取包络与接近条件成立
    composition: ATOMIC
    depends_on: [plan]
    parallel_group: 无
    parent: plan
  - id: carry
    phase: carry
    gate: 壶柄保持令牌有效且载荷组合获准
    composition: ATOMIC
    depends_on: [pick]
    parallel_group: 无
    parent: plan
  - id: transfer
    phase: transfer
    gate: 已至杯旁，液位与溢出观测路径已按本变体验证
    composition: EXPANDABLE
    depends_on: [carry]
    parallel_group: 无
    parent: plan
  - id: align
    phase: align
    gate: 壶与杯口身份新鲜且姿态可比较
    composition: ATOMIC
    depends_on: [transfer]
    parallel_group: 无
    parent: transfer
  - id: pour
    phase: pour
    gate: 杯口对位通过且模拟倾倒工况获准
    composition: PROVIDER_COMPOSITE
    depends_on: [align]
    parallel_group: 无
    parent: transfer
  - id: restage
    phase: restage
    gate: 流已停止且壶已回正，原支撑区域可见
    composition: ATOMIC
    depends_on: [pour]
    parallel_group: 无
    parent: plan
  - id: rest
    phase: rest
    gate: 已确认支撑，右手接管路径有效
    composition: ATOMIC
    depends_on: [restage]
    parallel_group: 无
    parent: plan
  replan_trigger: 溢出或液位未知转入回正与安全检查子图
capabilities:
- name: s2.expand
  status: 内部节点
  reference: vla-harness/docs/harness-design.md
  requirements: 入口：任务修订、目标杯与液位标准已确认。退出检查：目标杯与液位标准已绑定；入口：已至杯旁，液位与溢出观测路径已按本变体验证。退出检查：液位标准、杯口与壶嘴已绑定
- name: acquire_object
  status: 已有卡
  reference: vla-harness/contracts/v1/examples/capability.acquire-object.json
  requirements: 入口：壶柄身份、握取包络与接近条件成立。退出检查：壶柄身份与接触分别确认
- name: move_payload
  status: 已有卡
  reference: vla-harness/contracts/v1/examples/capability.move-payload.json
  requirements: 入口：壶柄保持令牌有效且载荷组合获准。退出检查：壶体到达且路径清空
- name: align_for_use
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：壶与杯口身份新鲜且姿态可比较。退出检查：壶嘴与杯口关系合格
- name: pour_liquid
  status: 需新建
  reference: 待发布
  requirements: 入口：杯口对位通过且模拟倾倒工况获准。退出检查：液位与溢出分别验证
- name: release_to_support
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：已确认支撑，右手接管路径有效。退出检查：壶直立、受支撑且手已脱离
- name: stage_for_next_use
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：流已停止且壶已回正，原支撑区域可见。退出检查：流已停止，壶底与支撑区域已对准
