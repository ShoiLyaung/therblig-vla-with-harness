occupancy:
- phase: plan
  resources: E:OBSERVE、L:MAINTAINED
  combination: 无身体写入
  handoff: 只生成子图
- phase: pick
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: 单臂准入
  handoff: 保持令牌绑定壶
- phase: carry
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、W:DRIVE、L:MAINTAINED
  combination: carry-with-support
  handoff: 搬运期间保持手部
- phase: transfer
  resources: RH:MAINTAINED、L:MAINTAINED、E:OBSERVE；S2 展开子图
  combination: 无身体写入
  handoff: 原壶柄保持跨越展开，不生成新 grant
- phase: align
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、L:MAINTAINED
  combination: 需要当前杯口容差
  handoff: 沿用壶柄保持
- phase: pour
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、L:MAINTAINED
  combination: 需批准偏载包络
  handoff: 壶回正后检查流已停止
- phase: restage
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、L:MAINTAINED
  combination: 站姿单臂准入
  handoff: 保留 RH 依赖
- phase: rest
  resources: E:OBSERVE、RA:DRIVE、RH:TAKEOVER、L:MAINTAINED
  combination: 带撤出变体独立核准
  handoff: 接管并消费令牌
checkpoints:
- phase: align
  SUCCESS: 杯口和壶嘴位置同步可见
  FAILED: 壶嘴对准其他容器
  UNKNOWN: 遮挡导致杯口候选不唯一
  recovery: 维持直立并补证
- phase: pour
  SUCCESS: 目标杯液位达标且溢出检查通过
  FAILED: 确认流入错误容器或越界洒出
  UNKNOWN: 只有壶体减载、液面不可见
  recovery: 确认流已停，对杯与托盘分别取证
- phase: rest
  SUCCESS: 壶已由原支撑面承载且脱手
  FAILED: 壶倾倒或仍挂在手上
  UNKNOWN: 支撑面不可见
  recovery: 复核支撑与手部处置
context: [分别记录源壶、目标杯、目标液位标准与托盘范围, 壶姿变化使旧液位读数过期]
memory: [保留首次倾倒与回正的观测窗口、溢出区域和补证修订]
training:
  labels: [PN, G, TL, H, P, U, PP, RL]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 液面遮挡、正常减载与滑移分开注入
  teleoperation: 记录真实反光、挂液与回正后的残流用于评估
  cross_embodiment: 迁移臂部对位，液体动力学和力通道单独验证
test_vectors:
- given: [目标杯液面被挡，托盘液滴尚未确认为越界。本向量只评价液位谓词；若独立证实越界，整段 effect_holds 为 FALSE，verdict 为 FAILED。]
  when: F05
  expected_records: [S1 保留姿态及观测来源, Verifier 将目标液位谓词记 UNKNOWN；尚未证实托盘液滴越界]
  ordering: [确认安全停止倾倒先于换视角, 补证后再决定是否继续]
  forbidden_outcomes: [凭壶重量下降提交达标, 盲目追加倾倒]
  assertions:
  - alias: level
    record_type: 观测质量
    path: /液面
    equals: 遮挡
    source: 适配器
    record: level
  - alias: check
    record_type: Verification
    path: /predicates/0/value
    equals: UNKNOWN
    source: 协议
    record: check
  - alias: criterion
    source: 协议
    record_type: Verification
    record: check
    path: /predicates/0/predicate/id
    equals: generic/target_level@1
  before:
  - first: level
    then: check
- given: [杯中液面遮挡，托盘边界与反证观测已独立核对。]
  when: F05b
  assertions:
  - alias: spill
    source: 适配器
    record: tray
    record_type: 托盘观测
    path: /越界
    equals: 已证实
  - alias: liquid
    source: 协议
    record_type: Verification
    record: check
    path: /predicates/0/value
    equals: UNKNOWN
  - alias: no_spill
    source: 协议
    record_type: Verification
    record: check
    path: /predicates/1/value
    equals: 'FALSE'
  - alias: effect
    source: 协议
    record_type: Verification
    record: check
    path: /checks/effect_holds
    equals: 'FALSE'
  - alias: failed
    source: 协议
    record_type: Verification
    record: check
    path: /verdict
    equals: FAILED
  before:
  - first: spill
    then: failed
  expected_records: [液位谓词 UNKNOWN, 无越界溢出谓词 FALSE, 本段 effect_holds 为 FALSE，verdict 为 FAILED]
  ordering: [取得越界反证先于失败判定]
  forbidden_outcomes: [以一个未知液位谓词覆盖已证实的反证]
evidence_refs:
- vla-harness/contracts/v1/examples/capability.acquire-object.json
- vla-harness/contracts/v1/examples/capability.move-payload.json
- vla-harness/contracts/v1/examples/verification.unknown-occluded.json
- vla-harness/contracts/v1/examples/body-profile.g1-inspire.json
protocol_checks:
- object: Capability
  fields: [parameter_schema, result_schema]
  criterion: 冻结容器、目标杯与标准
- object: Result
  fields: [outputs, evidence]
  criterion: 液位、溢出及回正是独立事实
- object: Verification
  fields: [predicates, verdict]
  criterion: 遮挡保留未知
verification_boundaries:
  phases: [align, pour, rest]
  terminal_success: rest
