    gate: 有空手与清空路径证据
    composition: ATOMIC
    depends_on: [release]
    parallel_group: 无
    parent: 无
  replan_trigger: 旧调用仍活动则等待；确认已静稳后才生成新尝试
capabilities:
- name: locate_candidates
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：场景与目标描述已冻结。退出检查：杯身份和观测源一致
- name: move_unloaded
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：目标已定位、禁选物新鲜且空手路径获准。退出检查：到位且杯未动；入口：有空手与清空路径证据。退出检查：架位稳定且手已清空
- name: acquire_object
  status: 已有卡
  reference: vla-harness/contracts/v1/examples/capability.acquire-object.json
  requirements: 入口：已到预抓位且身份一致、hand.acquire_slow 可用。退出检查：身份与相对运动同证
- name: move_payload
