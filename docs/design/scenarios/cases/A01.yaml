dag:
  nodes:
  - id: find
    phase: find
    gate: 场景与目标描述已冻结
    composition: ATOMIC
    depends_on: []
    parallel_group: 无
    parent: 无
  - id: approach
    phase: approach
    gate: 目标已定位、禁选物新鲜且空手路径获准
    composition: ATOMIC
