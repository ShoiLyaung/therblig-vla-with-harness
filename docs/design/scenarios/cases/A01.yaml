scenario_id: A01
revision: 草案一
tier: A
title: 单臂拾放红杯
baseline_refs:
  root: 67c066d
  harness: ed2eb4b
  provider: 99b37bf
  catalog: 0.2.0
  body_profile: g1-inspire@3
goal: 将场景内绑定的红杯移到指定架位
success_definition: 最新修订下同一杯由架面支撑，手已脱离且回撤未扰动杯位
authorization:
  status: 条件授权
  scope: 站姿单臂与保持交接
  reason: 轴向计数不能识别杯色或支撑面
  would_authorize: 站姿准入、低速闭合、同手有效空载基线及独立视觉支撑证据
  provenance: [DATASHEET_DECLARED, NEEDS_VALIDATION]
ambiguity: 取得控制的 G 以 acquired 点结束；RH 在 RA 的 TL 区间保持 H，不参加手指动作损失
phases:
- id: find
  goal: 确定红杯与邻物
  capability: locate_candidates
  s0_modes: BALANCE
  verification: 杯身份和观测源一致
  monitor_need: MR-02
  authorization: 条件授权
  codes: [SH, FD, ST]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 杯身份和观测源一致
- id: approach
  goal: 接近预抓位
  capability: move_unloaded
  s0_modes: BALANCE
  verification: 到位且杯未动
  monitor_need: MR-02
  authorization: 条件授权
  codes: [TE]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 到位且杯未动
- id: acquire
  goal: 取得目标控制
  capability: acquire_object
  s0_modes: hand.acquire_slow
  verification: 身份与相对运动同证
  monitor_need: MR-05
  authorization: 条件授权
  codes: [G]
  coverage: 已覆盖
  fault_refs: [F01, F01b]
  authorization_note: 身份与相对运动同证
- id: carry
  goal: 载杯至架旁
  capability: move_payload
  s0_modes: RETENTION、BALANCE
  verification: 杯离桌并随臂移动
  monitor_need: MR-05
  authorization: 条件授权
  codes: [TL, H]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 杯离桌并随臂移动
- id: stage
  goal: 向架位预置
  capability: stage_for_next_use
  s0_modes: RETENTION
  verification: 架面可见且姿态合格
  monitor_need: MR-05
  authorization: 条件授权
  codes: [PP, H]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 架面可见且姿态合格
- id: release
  goal: 卸载至支撑面
  capability: release_to_support
  s0_modes: COMPLIANCE
  verification: 观察架面支撑与分离
  monitor_need: MR-05
  authorization: 条件授权
  codes: [RL]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 观察架面支撑与分离
- id: withdraw
  goal: 空手撤回
  capability: move_unloaded
  s0_modes: BALANCE
  verification: 架位稳定且手已清空
  monitor_need: MR-02
  authorization: 条件授权
  codes: [TE]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 架位稳定且手已清空
faults:
- id: F01
  at_boundary: acquire
  injection: 创建回包丢失
  expected_records: [S2 记调用视图 UNKNOWN, D8 原键回查 ADMITTED 后读取 Execution 和 core_evidence]
  ordering: [冻结调用先于创建, 确认旧执行与资源处置先于冲突派发]
  forbidden_outcomes: [再次物理抓取, 以超时断言未受理]
- id: F01b
  at_boundary: acquire
  injection: 力子句从未布防，原宽限在空窗中届满；保留期内续租时力输入已恢复
  expected_records:
  - 同一保护请求和 Event 引用相同事件、保护 ID
  - CANCEL_AFFECTED 指明 contact_force_envelope 的 GRACE_EXPIRED
  - S2 持久预算已尽，同条件申请拒绝
  - 随后独立的新证据证明工况改变，仅在对账后重新评估新尝试
  - S0 独立回执的 event_ref 和 protection_id 与该中断相符，送达先后均可
  ordering: [先请求本地收紧再发布 Event, 同条件预算用尽先于拒绝, 新证据先于按变化条件重新规划]
  forbidden_outcomes: [以续租重置宽限, 预算用尽仍原样重派, 把重复的旧证据当作新证据]
monitor_needs:
- mr: MR-02
  concern: 错杯趋近
  evidence: 实体锚点、禁选物与接近轨迹
  d9: generic/target_identity@1
  maximum: SLOW
- mr: MR-05
  concern: 提起后滑移
  evidence: 同手计数趋势和物手相对位移
  d9: generic/contact_force_envelope@1
  maximum: SOFT_HOLD
- mr: MR-01
  concern: 独立基线核验跌倒、碰撞或危险闯入
  evidence: 合格的本体／世界证据与 S0 实际保护回执
  d9: baseline/fall@1（其他危险依部署登记的基线硬规则）
  maximum: STOP_LATCHED
gap_refs: [E01, E02, M01]
coverage:
  components:
    Planner: 已覆盖
