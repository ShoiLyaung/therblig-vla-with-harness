    RH: {label: 稳定, owner: S0, access: MAINTAINED, observation_mask: 按新鲜有效通道, action_mask: 屏蔽, missing_mask: 无效或饱和通道屏蔽}
    W: {label: 稳定, owner: S0, access: MAINTAINED, observation_mask: 按新鲜有效通道, action_mask: 屏蔽, missing_mask: 无效或饱和通道屏蔽}
    L: {label: 平衡, owner: S0, access: MAINTAINED, observation_mask: 按新鲜有效通道, action_mask: 屏蔽, missing_mask: 无效或饱和通道屏蔽}
occupancy:
- phase: find
  resources: E:OBSERVE、L:MAINTAINED
  combination: 纯观察
  handoff: 冻结 scene_id 与排除列表
- phase: approach
  resources: E:OBSERVE、RA:DRIVE、L:MAINTAINED
  combination: 独立单臂准入
  handoff: 空手到位后交还 RA
- phase: acquire
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: 独立单臂准入
  handoff: 握稳后交给 hand.retain
- phase: carry
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、W:DRIVE、L:MAINTAINED
  combination: carry-with-support
  handoff: 登记保持令牌
- phase: stage
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、L:MAINTAINED
  combination: 站姿单臂准入
  handoff: 保留 RH 依赖
- phase: release
  resources: E:OBSERVE、RA:DRIVE、RH:TAKEOVER、L:MAINTAINED
  combination: 带撤出变体独立核准
  handoff: 接管并消费令牌
- phase: withdraw
  resources: E:OBSERVE、RA:DRIVE、L:MAINTAINED
  combination: 独立单臂准入
  handoff: 核对空手再撤
checkpoints:
- phase: acquire
  SUCCESS: 红杯身份与握稳证据同属一次调用
  FAILED: 观察到握住邻杯
  UNKNOWN: 仅有轴向变化而目标被挡
  recovery: 维持负载并换视角
- phase: withdraw
  SUCCESS: 观察到红杯在架且回撤后稳定
  FAILED: 确认红杯仍在桌上或已跌落
  UNKNOWN: 架面遮挡，无法看清支撑关系
  recovery: 补证后追加 Verification
context: [缓存目标锚点、架面与禁选实例, 视角变更时重验新鲜度]
memory: [保留原 invocation_id、D8 查询记录与令牌消费历史]
training:
  labels: [SH, FD, ST, TE, G, TL, H, PP, RL]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 对照创建回包正常与丢失轨迹
  teleoperation: 配对记录原生手闭合与离桌时刻
  cross_embodiment: 迁移空载臂轨，屏蔽不匹配手指轴
test_vectors:
- given: [调用已发且供应方已受理，查询原执行时仍在运行。, 将场景内绑定的红杯移到指定架位, 偏序只比较 S2 收到的两次读取响应。]
  when: F01
  expected_records: [S2 记调用视图 UNKNOWN, D8 原键回查 ADMITTED 后读取 Execution 和 core_evidence]
  ordering: [冻结调用先于创建, 确认旧执行与资源处置先于冲突派发]
  forbidden_outcomes: [再次物理抓取, 以超时断言未受理]
  assertions:
  - alias: lookup_read
    record: lookup_read
    source: 协议
    record_type: InvocationLookup
    path: /status
    equals: ADMITTED
  - alias: execution_read
    record: execution_read
    source: 协议
    record_type: Execution
    path: /state
    equals: RUNNING
  before:
  - first: lookup_read
    then: execution_read
- given: [同次启动、原阶段已占用；重试计数跨 attempt 持久保存，同条件预算已耗尽。]
  when: F01b
  expected_records:
  - 同一保护请求和 Event 引用相同事件、保护 ID
  - CANCEL_AFFECTED 指明 contact_force_envelope 的 GRACE_EXPIRED
  - S2 持久预算已尽，同条件申请拒绝
  - 随后独立的新证据证明工况改变，仅在对账后重新评估新尝试
  - S0 独立回执的 event_ref 和 protection_id 与该中断相符，送达先后均可
  ordering: [先请求本地收紧再发布 Event, 同条件预算用尽先于拒绝, 新证据先于按变化条件重新规划]
  forbidden_outcomes: [以续租重置宽限, 预算用尽仍原样重派, 把重复的旧证据当作新证据]
  assertions:
  - alias: hold
    record: req
    source: 适配器
    record_type: 本地保护请求
    path: /level
    equals: SOFT_HOLD
  - alias: cause
    record: req
    source: 适配器
    record_type: 本地保护请求
    path: /event_ref
    equals: event.required-clause-unarmed-grace-expired
  - alias: requested
    record: req
    source: 适配器
    record_type: 本地保护请求
    path: /protection_id
    equals: protect.required-clause-unarmed-grace-expired
  - alias: event
    record: irq
    source: 协议
    record_type: Event
    path: /event_id
    equals: event.required-clause-unarmed-grace-expired
  - alias: link
    record: irq
    source: 协议
    record_type: Event
    path: /protection_ref
    equals: protect.required-clause-unarmed-grace-expired
  - alias: disp
    record: irq
    source: 协议
    record_type: Event
    path: /interrupt/disposition
    equals: CANCEL_AFFECTED
  - alias: expiry
    record: irq
    source: 协议
    record_type: Event
    path: /detection/clause_failures/0/failure
    equals: GRACE_EXPIRED
  - alias: slot
    record: irq
    source: 协议
    record_type: Event
    path: /detection/clause_failures/0/clause_id
    equals: contact_force_envelope
  - alias: spent
    record: spent
    source: 适配器
    record_type: 重试预算
    path: /同条件
    equals: 已耗尽
  - alias: deny
    record: deny
    source: 适配器
    record_type: 派发记录
    path: /同条件新调用
    equals: 未派发
  - alias: changed
    record: changed
    source: 适配器
    record_type: 证据复测
    path: /工况
    equals: 变化已核实
  - alias: replan
    record: replan
    source: 适配器
    record_type: 新尝试
    path: /入口
    equals: 变化条件已对账
  - alias: receipt_event
    source: 协议
    record_type: ProtectionReceipt
    record: applied
    path: /event_ref
    equals: event.required-clause-unarmed-grace-expired
  - alias: receipt_id
    source: 协议
    record_type: ProtectionReceipt
    record: applied
    path: /protection_id
    equals: protect.required-clause-unarmed-grace-expired
  before:
  - first: hold
    then: event
  - first: spent
    then: deny
  - first: changed
    then: replan
evidence_refs:
- vla-harness/contracts/v1/examples/invocation.pick-red-cup.json
- vla-harness/contracts/v1/examples/execution.running.json
- vla-harness/contracts/v1/examples/capability.acquire-object.json
- vla-harness/contracts/v1/examples/verification.unknown-occluded.json
- vla-harness/contracts/v1/examples/body-profile.g1-inspire.json
- vla-harness/contracts/v1/examples/clause-kind.motion-envelope.json
- vla-harness/contracts/v1/examples/event.required-clause-unarmed-grace-expired.json
protocol_checks:
- object: Invocation
  fields: [invocation_id, start_deadline]
  criterion: 原身份和原截止执行 D8 对账
- object: Execution
  fields: [invocation_id, leases]
  criterion: 按原调用归集授权
- object: Result
  fields: [resource_dispositions, quiescence]
  criterion: 保持与释放各自可核对
deployment_invariants: [S2 和 Monitor 固定同一登记修订，按 evaluator_ref 的 revision 与 digest 核验评估器；S2 不等待 Monitor 布防]
verification_boundaries:
  phases: [acquire, withdraw]
  terminal_success: withdraw
