scenario_id: A02
revision: 草案一
tier: A
title: 纠正红蓝杯目标
baseline_refs:
  root: 67c066d
  harness: ed2eb4b
  provider: 99b37bf
  catalog: 0.2.0
  body_profile: g1-inspire@3
goal: 纠正原有拾放任务，改将蓝杯送到目标架位
success_definition: 蓝杯处于新目标位置，红杯及旧结果均未提交到新修订
authorization:
  status: 条件授权
  scope: 认证纠正输入后的空手回撤与蓝杯站姿拾放；持物未知载荷恢复分支当前本体未授权
  reason: 麦克风有规格声明但本机流未验证，未知载荷不能走普通搬运入口
  would_authorize: 空手分支须认证输入、证实已空手、冲突资源结清且经 S0 重新准入；持物分支还需获准的未知载荷恢复能力
  provenance: [DATASHEET_DECLARED, NEEDS_VALIDATION]
  scope_branches:
  - description: 认证纠正输入后的空手回撤与蓝杯站姿拾放
    phases: [red, reconcile, retreat, new, blue_carry, blue_stage, blue_release]
    status: 条件授权
  - description: 持物未知载荷恢复分支当前本体未授权
    phases: [red, reconcile, restore, new, blue_carry, blue_stage, blue_release]
    status: 当前本体未授权
ambiguity: ST 由 S2 重绑实体，抬起未知载荷放回是 TL/PP/RL，不是继续旧 G
phases:
- id: red
  goal: 按旧修订取得红杯
  capability: acquire_object
  s0_modes: COMPLIANCE
  verification: 旧修订证据只供历史
  monitor_need: MR-02
  authorization: 条件授权
  codes: [G]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 旧修订证据只供历史
- id: reconcile
  goal: 核实纠正与实际占用
  capability: s2.reconcile
  s0_modes: RETENTION 或安全保持
  verification: 权威意图与所有权均可定位
  monitor_need: MR-08
  authorization: 条件授权
  codes: [PN, H]
  coverage: 已覆盖
  fault_refs: [F02a, F02b, F02c]
  authorization_note: 权威意图与所有权均可定位
- id: restore
  goal: 受控放回未知载荷并退出
  capability: safe_putback_unknown_payload
  s0_modes: RETENTION 转 COMPLIANCE
  verification: 所选恢复调用的公开 Result 证实安全退出、手已空且冲突资源逐项处置已结清
  monitor_need: MR-02
  authorization: 当前本体未授权
  codes: [TL, PP, H, RL]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 一次封装调用，未知载荷包络及恢复能力未获准
- id: retreat
  goal: 空手时撤离
  capability: move_unloaded
  s0_modes: BALANCE
  verification: 无接触且工作区清空
  monitor_need: MR-02
  authorization: 条件授权
  codes: [TE]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 无接触且工作区清空
- id: new
  goal: 选择蓝杯并在新修订下获取
  capability: acquire_object
  s0_modes: hand.acquire_slow
  verification: 独立核对蓝杯在手
  monitor_need: MR-02
  authorization: 条件授权
  codes: [ST, G]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 仅所选恢复调用的公开 Result 与逐资源处置核实后才可派发
- id: blue_carry
  goal: 载杯至架旁
  capability: move_payload
  s0_modes: RETENTION、BALANCE
  verification: 杯离桌并随臂移动
  monitor_need: MR-05
  authorization: 条件授权
  codes: [TL, H]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 杯离桌并随臂移动
- id: blue_stage
  goal: 向架位预置
  capability: stage_for_next_use
  s0_modes: RETENTION
  verification: 架面可见且姿态合格
  monitor_need: MR-05
  authorization: 条件授权
  codes: [PP, H]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 架面可见且姿态合格
- id: blue_release
  goal: 卸载至支撑面
  capability: release_to_support
  s0_modes: COMPLIANCE
  verification: 观察架面支撑与分离
  monitor_need: MR-05
  authorization: 条件授权
  codes: [RL]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 观察架面支撑与分离
faults:
- id: F02a
  at_boundary: reconcile
  injection: 持久流的缺口跨过保留边界，纠正观测缺失
  expected_records: [S2 冻结旧 outbox, 确认权威意图并补处理可回放段后记录 resync_checkpoint]
  ordering: [确认目标、完成身体对账先于解封]
  forbidden_outcomes: [由已停稳推断新目标]
- id: F02b
  at_boundary: reconcile
  injection: 取消已受理后本地停止故障，S0 权威账本证实右臂和右手尚未结清
  expected_records: [仅待确认时可读 STOPPING, 故障终态为 FAILED 且 cancel.state=ACCEPTED, 控制摘要 stable=false，未结清资源保持 QUARANTINED, 匹配原故障与资源的恢复证据先于重用]
  ordering: [隔离可早于终态, 核验恢复证据先于重新使用右侧资源]
  forbidden_outcomes: [未获稳定证据便把 STOPPING 强制改为 FAILED, 根据 FAILED 释放未结清资源]
- id: F02c
  at_boundary: reconcile
  injection: 撤销红杯简报后 Monitor 重启，先送达启动误差界以外的旧刷新
  expected_records: [旧简报在启动围栏丢弃, 独立基线照常运行, 仍存活蓝杯阶段的合格新鲜刷新按首发重装]
  ordering: [认证并比较本地映射 sent_at 先于安装, END／REVOKE 按绑定与序号处理]
  forbidden_outcomes: [用 issued_at 替代启动围栏的 sent_at, 把前次启动回收水位带入新实例]
monitor_needs:
- mr: MR-08
  concern: 认证纠正与普通追加请求分流
  evidence: 话语观测、身份、旧修订
  d9: 持续语音观测、认证纠正与基线停止词
  maximum: SOFT_HOLD
- mr: MR-02
  concern: 旧目标成为禁选对象
  evidence: 新锚点与旧目标历史
  d9: generic/target_identity@1
  maximum: SOFT_HOLD
- mr: MR-01
  concern: 独立基线核验跌倒、碰撞或危险闯入
  evidence: 合格的本体／世界证据与 S0 实际保护回执
  d9: baseline/fall@1（其他危险依部署登记的基线硬规则）
  maximum: STOP_LATCHED
- mr: MR-05
  concern: 持物滑移、载荷转移或非预期接触
  evidence: 绑定手的原始计数、指位和物手相对运动
  d9: generic/contact_force_envelope@1
  maximum: SOFT_HOLD
