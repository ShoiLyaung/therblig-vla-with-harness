occupancy:
- phase: red
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: 独立单臂准入
  handoff: 保留原执行句柄
- phase: reconcile
  resources: E:OBSERVE、L:MAINTAINED；持物分支 RH:MAINTAINED，空手分支核对 RELEASED
  combination: 取消后核对
  handoff: 读取原执行而非重建
- phase: restore
  resources: RA:DRIVE、L:MAINTAINED、E:OBSERVE；RH 在同一调用内由 DEPEND 转 TAKEOVER
  combination: 需已批准未知载荷包络
  handoff: 支撑确认后原子接管并放手，公开 Result 核对手及臂的最终处置
- phase: retreat
  resources: E:OBSERVE、RA:DRIVE、L:MAINTAINED
  combination: 互斥恢复分支
  handoff: 空手证据先于撤离
- phase: new
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: 仅已选恢复分支完成
  handoff: 红杯进入禁选集合
- phase: blue_carry
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、W:DRIVE、L:MAINTAINED
  combination: carry-with-support
  handoff: 登记保持令牌
- phase: blue_stage
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、L:MAINTAINED
  combination: 站姿单臂准入
  handoff: 保留 RH 依赖
- phase: blue_release
  resources: E:OBSERVE、RA:DRIVE、RH:TAKEOVER、L:MAINTAINED
  combination: 带撤出变体独立核准
  handoff: 接管并消费令牌
checkpoints:
- phase: reconcile
  SUCCESS: 权威意图、停稳与处置一致
  FAILED: 权威对账记录证明旧修订仍可派发，与应生效的修订围栏矛盾
  UNKNOWN: 缺口且未能核实当前目标
  recovery: 保留隔离并经宿主确认
- phase: new
  SUCCESS: 新修订的新鲜身份与握稳证据确认被控制的是绑定蓝杯
  FAILED: 明确抓到禁选红杯
  UNKNOWN: 手中杯身份不明
  recovery: 补证并用新修订继续安放
- phase: blue_release
  SUCCESS: 新修订证实蓝杯在指定架位，支撑转移并脱手
  FAILED: 红杯被放置或蓝杯明确掉落
  UNKNOWN: 杯色或承载面不可见
  recovery: 保持原提交边界并补证
context: [按目标修订隔离证据, 空手与持物恢复分支互斥, 旧图红杯调用仅提供对账证据；新图择一消费 restore 或 retreat 的公开 Result 和资源处置，未选分支不参与汇合]
memory: [冻结取消幂等键，保留旧结果及重同步检查点]
training:
  labels: [G, PN, H, TL, PP, RL, TE, ST]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 注入丢失观测和迟到结果
  teleoperation: 采集同布局交换杯色的配对操作
  cross_embodiment: 迁移接近轨；语音认证与实体身份重新标注
test_vectors:
- given: [旧修订仍有待派项；权威输入源保有认证纠正，当前事件段已过保留期。, 把红杯任务修订为拾取蓝杯]
  when: F02a
  expected_records: [S2 冻结旧 outbox, 确认权威意图并补处理可回放段后记录 resync_checkpoint]
  ordering: [确认目标、完成身体对账先于解封]
  forbidden_outcomes: [由已停稳推断新目标]
  assertions:
  - alias: confirmed
    record_type: 用户输入
    path: /意图状态
    equals: 已确认
    source: 适配器
    record: confirmed
  - alias: resume
    record_type: 检查点
    path: /恢复状态
    equals: 允许新修订派发
    source: 适配器
    record: resume
  before:
  - first: confirmed
    then: resume
- given: [原执行已有活动授权，S1 已受理取消；在停止过程中注入控制器故障并取得 S0 的逐资源处置。, 观测窗分两段：先验证故障后隔离持续；后续有合格恢复记录且 S0 重新准入时才检查重用。]
  when: F02b
  expected_records: [仅待确认时可读 STOPPING, 故障终态为 FAILED 且 cancel.state=ACCEPTED, 控制摘要 stable=false，未结清资源保持 QUARANTINED, 匹配原故障与资源的恢复证据先于重用]
  ordering: [隔离可早于终态, 核验恢复证据先于重新使用右侧资源]
  forbidden_outcomes: [未获稳定证据便把 STOPPING 强制改为 FAILED, 根据 FAILED 释放未结清资源]
  assertions:
  - alias: pending
    record: pending
    source: 协议
    record_type: Execution
    path: /state
    equals: STOPPING
    optional_record: true
  - alias: end
    record: fault
    source: 协议
    record_type: Execution
    path: /state
    equals: FAILED
  - alias: accepted
    record: fault
    source: 协议
    record_type: Execution
    path: /cancel/state
    equals: ACCEPTED
  - alias: stable
    record: fault
    source: 协议
    record_type: Execution
    path: /result/evidence/controller_summary/stable
    equals: false
  - alias: hand
    record: fault
    source: 协议
    record_type: Execution
    path: /resource_id
    equals: RH
    select:
      array_path: /result/resource_dispositions
      resource_id: RH
  - alias: unsettled
    record: fault
    source: 协议
    record_type: Execution
    path: /disposition
    equals: QUARANTINED
    select:
      array_path: /result/resource_dispositions
      resource_id: RH
  - alias: fence
    record: fence
    source: 适配器
    record_type: 资源对账
    path: /处置
    equals: 仍隔离
  - alias: cleared
    record: cleared
    source: 适配器
    record_type: 恢复核验
    path: /依据
    equals: 匹配原故障和资源的 S0 恢复凭据
  - alias: reuse
    record: reuse
    source: 适配器
    record_type: 再准入
    path: /资源
    equals: RH
  - alias: authoritative
    source: 适配器
    record_type: 本地停止账本
    record: s0_stop
    path: /RH处置
    equals: 未结清，隔离
  before:
  - first: cleared
    then: reuse
- given: [同一次启动中，较晚签发阶段的回收水位曾挡住未见过的早期蓝杯简报；蓝杯阶段仍有效。]
  when: F02c
  expected_records: [旧简报在启动围栏丢弃, 独立基线照常运行, 仍存活蓝杯阶段的合格新鲜刷新按首发重装]
  ordering: [认证并比较本地映射 sent_at 先于安装, END／REVOKE 按绑定与序号处理]
  forbidden_outcomes: [用 issued_at 替代启动围栏的 sent_at, 把前次启动回收水位带入新实例]
  assertions:
  - alias: drop
    record_type: 本地离线审计
    path: /旧快照
    equals: 启动围栏丢弃
    source: 适配器
    record: drop
  - alias: fresh
    record_type: 本地离线审计
    path: /蓝杯阶段
    equals: 新实例按首发安装
    source: 适配器
    record: fresh
  before:
  - first: drop
    then: fresh
evidence_refs:
- policy-harness/contracts/v1/examples/event.user-correction-interrupt.json
- policy-harness/contracts/v1/examples/execution.canceled-after-correction.json
- policy-harness/contracts/v1/examples/observation.utterance-new-request.json
- policy-harness/contracts/v1/examples/body-profile.g1-inspire.json
protocol_checks:
- object: Event
  fields: [interrupt, evidence_refs]
  criterion: 认证纠正引用先前话语
- object: Execution
  fields: [cancel, state]
  criterion: 取消受理与实际静稳分别检查
- object: Verification
  fields: [goal_revision, supersedes]
  criterion: 旧修订不得提交新进度
verification_boundaries:
  phases: [reconcile, new, blue_release]
  terminal_success: blue_release
