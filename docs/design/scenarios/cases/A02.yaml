dag:
  nodes:
  - id: red
    phase: red
    gate: 旧目标修订有效且预抓准入已通过
    composition: ATOMIC
    depends_on: []
    parallel_group: 无
    parent: 无
    graph_revision: rev1
  - id: reconcile
    phase: reconcile
    gate: 纠正、中断或游标缺口使旧分支隔离
    composition: S2_INTERNAL
    depends_on: []
    parallel_group: 无
    parent: 无
    graph_revision: rev2
  - id: restore
    phase: restore
    gate: 仅有持物证据且未知载荷在恢复包络内
    composition: PROVIDER_COMPOSITE
    depends_on: [reconcile]
    parallel_group: 无
    parent: 无
    graph_revision: rev2
  - id: retreat
    phase: retreat
    gate: 仅有空手证据且路径清空
    composition: ATOMIC
    depends_on: [reconcile]
    parallel_group: 无
    parent: 无
    graph_revision: rev2
  - id: new
    phase: new
    gate: 验证所选 restore 或 retreat 的公开 Result、空手实测和逐资源处置；蓝杯已绑定且红杯禁选
    composition: ATOMIC
    depends_on: []
    parallel_group: 无
    parent: 无
    graph_revision: rev2
    depends_on_one_of: [restore, retreat]
  - id: blue_carry
    phase: blue_carry
    gate: 蓝杯已取得且保持令牌有效
    composition: ATOMIC
    depends_on: [new]
    parallel_group: 无
    parent: 无
    graph_revision: rev2
  - id: blue_stage
    phase: blue_stage
    gate: 到达目标架旁且支撑区可核对
    composition: ATOMIC
    depends_on: [blue_carry]
    parallel_group: 无
    parent: 无
    graph_revision: rev2
  - id: blue_release
    phase: blue_release
    gate: 已证实蓝杯支撑面，允许接管
    composition: ATOMIC
    depends_on: [blue_stage]
    parallel_group: 无
    parent: 无
    graph_revision: rev2
  replan_trigger: 纠正生成新图修订，新图只消费旧执行的处置证据
  revision_cut:
    previous: rev1
    current: rev2
    trigger: 认证纠正建立新图；rev1 不再派发
    imported_evidence: [原 invocation_id 与执行句柄, 取消状态、静稳证据、逐轨处置及现有载荷令牌]
capabilities:
- name: acquire_object
  status: 已有卡
  reference: policy-harness/contracts/v1/examples/capability.acquire-object.json
  requirements: 入口：旧目标修订有效且预抓准入已通过。退出检查：旧修订证据只供历史；入口：验证所选 restore 或 retreat 的公开 Result、空手实测和逐资源处置；蓝杯已绑定且红杯禁选。退出检查：独立核对蓝杯在手
- name: s2.reconcile
  status: 内部节点
  reference: policy-harness/docs/harness-design.md
  requirements: 入口：纠正、中断或游标缺口使旧分支隔离。退出检查：权威意图与所有权均可定位
- name: safe_putback_unknown_payload
  status: 需新建
  reference: 待发布
  requirements: 入口：仅有持物证据且未知载荷在恢复包络内。退出检查：所选恢复调用的公开 Result 证实安全退出、手已空且冲突资源逐项处置已结清
- name: move_unloaded
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：仅有空手证据且路径清空。退出检查：无接触且工作区清空
- name: move_payload
  status: 已有卡
  reference: policy-harness/contracts/v1/examples/capability.move-payload.json
  requirements: 入口：蓝杯已取得且保持令牌有效。退出检查：杯离桌并随臂移动
- name: stage_for_next_use
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：到达目标架旁且支撑区可核对。退出检查：架面可见且姿态合格
- name: release_to_support
  status: 目录模板
  reference: therblig-vla/therbligs/catalog.v0.yaml
  requirements: 入口：已证实蓝杯支撑面，允许接管。退出检查：观察架面支撑与分离
