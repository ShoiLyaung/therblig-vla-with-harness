occupancy:
- phase: bind
  resources: E:OBSERVE、L:MAINTAINED
  combination: 观察
  handoff: 绑定材料批次与标准
- phase: grasp
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: 材料变体未批准
  handoff: 不能在无验证时转入持续保持
- phase: lift
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、W:DRIVE、L:MAINTAINED
  combination: carry-with-support 仍需材料授权
  handoff: 沿用同一材料和接触工况
- phase: inspect
  resources: E:OBSERVE、RH:MAINTAINED、L:MAINTAINED
  combination: 无新增驱动
  handoff: 未知时先安全放回
checkpoints:
- phase: grasp
  SUCCESS: 允许相对计数的已验证变体取得控制
  FAILED: 确认闭合压碎目标
  UNKNOWN: 饱和或不可辨别滑移
  recovery: 维持安全状态并补证
- phase: inspect
  SUCCESS: 按所选材料标准完整且已安全提升
  FAILED: 明确蛋壳裂纹、果肉压损或豆腐破碎
  UNKNOWN: 背面不可见且无合格替代证据
  recovery: 换视角或按合格能力放回
context: [缓存食材类型、实际手、承载通道、接触部位依据与校零状态]
memory: [保存原始计数及逐通道有效位, 跨食材批次不复用批准]
training:
  labels: [ST, G, TL, H, I]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 分开模拟压碎、滑落与信号饱和，材料模型只作标签候选
  teleoperation: 原生示教补充易损材质损伤标注
  cross_embodiment: 臂段可迁移；刚体夹爪数据不能充当柔软食材的接触真值
test_vectors:
- given: [选择必须核验绝对力的材料变体，受力指无适用转换及批准。, 在闭合过冲受限的工况下拾取鸡蛋、草莓或豆腐]
  when: F06a
  expected_records: [Resolver 阻塞, 无创建调用, 保留所缺批准范围]
  ordering: [校验手、通道、标定修订与工况先于任何派发]
  forbidden_outcomes: [用第三方拟合或电流直接代替 N]
  assertions:
  - alias: metric
    record_type: 证据批准
    path: /适用性
    equals: 无匹配通道批准
    source: 适配器
    record: metric
  - alias: gate
    record_type: 解析记录
    path: /状态
    equals: 阻塞
    source: 适配器
    record: gate
  before:
  - first: metric
    then: gate
- given: [相对计数变体已获工况验证，提升后需重新检验完整性。, 在闭合过冲受限的工况下拾取鸡蛋、草莓或豆腐]
  when: F06b
  expected_records: [Verifier 对完整性记 UNKNOWN, 记录无效通道掩码]
  ordering: [安全支撑先于换视角]
  forbidden_outcomes: [未见裂纹即判完整]
  assertions:
  - alias: mask
    record_type: 观测质量
    path: /材料可见性
    equals: 背面遮挡
    source: 适配器
    record: mask
  - alias: check
    record_type: Verification
    path: /verdict
    equals: UNKNOWN
    source: 协议
    record: check
  before:
  - first: mask
    then: check
evidence_refs:
- policy-harness/contracts/v1/examples/capability.acquire-object.json
- policy-harness/contracts/v1/examples/observation-stream.hand-force.json
- policy-harness/contracts/v1/examples/body-profile.g1-inspire.json
protocol_checks:
- object: Capability
  fields: [semantics, limits]
  criterion: 通道用途和低速配置另验
- object: BodyProfile
  fields: [sensors, s0_profiles]
  criterion: 未标定通道不能换算绝对力
- object: Verification
  fields: [predicates, evaluated_at]
  criterion: 按食材标准检查完整性
verification_boundaries:
  phases: [grasp, inspect]
  terminal_success: inspect
