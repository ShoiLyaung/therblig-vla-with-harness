occupancy:
- phase: find
  resources: E:OBSERVE、L:MAINTAINED
  combination: 纯观察
  handoff: 记录布料实例及地标对应
- phase: left
  resources: E:OBSERVE、LA:DRIVE、LH:DRIVE、L:MAINTAINED
  combination: 需批准柔性双臂工况
  handoff: 左手转保持
- phase: right
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: 需批准柔性双臂工况
  handoff: 右手转保持
- phase: fold
  resources: E:OBSERVE、LA:DRIVE、RA:DRIVE、LH:DEPEND、RH:DEPEND、L:MAINTAINED
  combination: 需双臂协调变体
  handoff: 保留两侧保持至稳定支撑
- phase: lay
  resources: E:OBSERVE、LA:DRIVE、RA:DRIVE、LH:TAKEOVER、RH:TAKEOVER、L:MAINTAINED
  combination: 双手退出须独立批准
  handoff: 确认台面支撑后同步协调放手
- phase: inspect
  resources: E:OBSERVE、L:MAINTAINED
  combination: 纯观察
  handoff: 保留缺失地标标记
checkpoints:
- phase: fold
  SUCCESS: 目标角配对与折边拓扑可见且合格
  FAILED: 明确配错角或折向相反
  UNKNOWN: 外轮廓正确但隐藏角不可见
  recovery: 局部取证或重抓，保留先前未知
- phase: inspect
  SUCCESS: 松手后地标与轮廓仍符合 Q
  FAILED: 松手后明显展开或偏出区域
  UNKNOWN: 遮挡或材质纹理不足以区分布层
  recovery: 换视角或请求人工核验
context: [记录布角持久身份、正反面、折线和目标区域, 折叠后旧位置失效]
memory: [存档折前后观测、可见区和地标对应，区分观测与仿真真值]
training:
  labels: [SH, FD, ST, G, TL, P, H, PP, RL, I]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 用布网格真值评分，给策略的只有可观测输入
  teleoperation: 采集真实褶皱、材质差异及遮挡下的 UNKNOWN 标注
