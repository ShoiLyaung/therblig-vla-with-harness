scenario_id: A08
revision: 草案一
tier: A
title: 折叠毛巾或衣物
baseline_refs:
  root: 67c066d
  harness: ed2eb4b
  provider: 99b37bf
  catalog: 0.2.0
  body_profile: g1-inspire@3
goal: 将布料折至指定轮廓并平放
success_definition: 目标角点配对、折边关系及放置区域均符合标准 Q，双手退出后形态仍保持
authorization:
  status: 当前本体未授权
  scope: 可变形物的双手协同与形态检验
  reason: 目录可描述操作，但未发布获准的双手折叠变体及遮挡下验证标准
  would_authorize: 建立材质与关键点标准，验证双臂组合、接触与松手后的形态证据
  provenance: [NEEDS_VALIDATION]
ambiguity: 携带布角移位是 TL，按当前折边地标和标准 Q 对位是 P，手的保持记 H；为后续收纳摆放才是 PP
phases:
- id: find
  goal: 定位布角和目标折边
  capability: locate_candidates
  s0_modes: BALANCE
  verification: 可见角点区分且观测新鲜
  monitor_need: MR-02
  authorization: 条件授权
  codes: [SH, FD, ST]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 仅可观察可辨布角；验收所需地标配对与复核路径待验证
- id: left
  goal: 取得左角
  capability: acquire_object
  s0_modes: COMPLIANCE
  verification: 左角随手移动
  monitor_need: MR-05
  authorization: 当前本体未授权
  codes: [G]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 左角随手移动
- id: right
  goal: 取得右角
  capability: acquire_object
  s0_modes: COMPLIANCE
  verification: 右角随手移动
  monitor_need: MR-05
  authorization: 当前本体未授权
  codes: [G]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 右角随手移动
- id: fold
  goal: 沿折边对位并折叠
  capability: fold_fabric
  s0_modes: RETENTION、COMPLIANCE
  verification: 成对地标与折边标准同时成立
  monitor_need: MR-02
  authorization: 当前本体未授权
  codes: [TL, P, H]
  coverage: 需要但被阻塞
  fault_refs: [F08]
  authorization_note: 成对地标与折边标准同时成立
- id: lay
  goal: 将折好布料平放
  capability: place_fabric
  s0_modes: COMPLIANCE
  verification: 双手退出且形态仍稳定
  monitor_need: MR-05
  authorization: 当前本体未授权
  codes: [PP, RL]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 双手退出且形态仍稳定
- id: inspect
  goal: 按标准核验折后状态
  capability: measure_condition
  s0_modes: BALANCE
  verification: 关键点配对与区域合格
  monitor_need: MR-02
  authorization: 条件授权
  codes: [I]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 仅检查输入质量与 UNKNOWN；遮挡下的正向形态验收仍受阻
faults:
- id: F08
  at_boundary: fold
  injection: 一角滑出视野，二维外轮廓似已对齐
  expected_records: [S1 记录可见区和保持处置, Verifier 对隐藏角配对记 UNKNOWN]
  ordering: [重观测布角与支撑先于提交, 必要时换图重抓]
  forbidden_outcomes: [从矩形轮廓断言夹层平整]
monitor_needs:
- mr: MR-02
  concern: 布角错配或同色重叠
  evidence: 轮廓与可复核的布角观测
  d9: generic/target_identity@1
  maximum: SLOW
- mr: MR-05
  concern: 一侧布边脱手
  evidence: 手物相对运动及逐手载荷
  d9: generic/contact_force_envelope@1
  maximum: SOFT_HOLD
- mr: MR-01
  concern: 独立基线核验跌倒、碰撞或危险闯入
  evidence: 合格的本体／世界证据与 S0 实际保护回执
  d9: baseline/fall@1（其他危险依部署登记的基线硬规则）
  maximum: STOP_LATCHED
gap_refs: [M04, E05, M01]
