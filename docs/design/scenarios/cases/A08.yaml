extends_walkthrough: 独立用例
dag:
  nodes:
  - id: find
    phase: find
    gate: 折叠目标、布料实例与地标标准已绑定
    composition: ATOMIC
    depends_on: []
    parallel_group: 无
    parent: 无
  - id: left
    phase: left
    gate: 左角可见且双臂取角组合批准
    composition: ATOMIC
    depends_on: [find]
    parallel_group: 取两角
    parent: 无
  - id: right
    phase: right
    gate: 右角可见且双臂取角组合批准
    composition: ATOMIC
    depends_on: [find]
    parallel_group: 取两角
    parent: 无
  - id: fold
    phase: fold
    gate: 两角已证实受控、协调变体与避碰条件获准
    composition: PROVIDER_COMPOSITE
    depends_on: [left, right]
    parallel_group: 无
    parent: 无
  - id: lay
    phase: lay
    gate: 折边验证通过且支撑面可见
    composition: PROVIDER_COMPOSITE
    depends_on: [fold]
    parallel_group: 无
    parent: 无
  - id: inspect
    phase: inspect
    gate: 双手已安全退出，折后观测与标准匹配
    composition: ATOMIC
    depends_on: [lay]
    parallel_group: 无
    parent: 无
  replan_trigger: 布角失配或松手后反弹则从新观测展开新修订
