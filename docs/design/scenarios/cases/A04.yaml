  catalog: 0.2.0
  body_profile: g1-inspire@3
goal: 到达物件附近并在稳定站姿下抓取
success_definition: 到达、稳定支撑、目标在手和安全保持均有实测证据
authorization:
  status: 当前本体未授权
  scope: 实机步态支撑证据及腿臂动态组合；静稳站姿获取单独审查
  reason: 行走仅仿真已覆盖；实机惯性与足接触估计均未获准，步态与上身并发也无批准组合
  would_authorize: 验证本机支撑路径；并行另需获准的动态耦合守卫
  provenance: [DATASHEET_DECLARED, NEEDS_VALIDATION]
ambiguity: LO 只标基座位移；停止后 L 的平衡不再标 LO，上身 G/TL 单独分轨
phases:
- id: walk
  goal: 仿真包络下达到接近区
  capability: locomote
  s0_modes: support.walk
  verification: 有基座定位与支撑证据
  monitor_need: MR-04
  authorization: 当前本体未授权
  codes: [x.locomote]
  coverage: 需要但被阻塞
  fault_refs: [F04a, F04b]
  authorization_note: 有基座定位与支撑证据
- id: stand
  goal: 核实腿轨释放与站稳
  capability: s2.barrier
  s0_modes: support.balance
  verification: 实测稳定且旧 grant 失效
  monitor_need: MR-01
  authorization: 条件授权
  codes: [PN]
  coverage: 需要但被阻塞
  fault_refs: []
  authorization_note: 独立站姿可核验；从实机步态退出的正向分支缺获准的前驱
- id: grasp
  goal: 站姿下取得目标
  capability: acquire_object
  s0_modes: hand.acquire_slow
  verification: 对象身份与物手关系正确
  monitor_need: MR-01
  authorization: 条件授权
  codes: [G]
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 从已验证静稳站姿开始，只核准独立上肢获取
faults:
- id: F04a
  at_boundary: walk
  injection: 活跃阶段内 Monitor 重启，首次有效刷新前跌倒
  expected_records: [规则层直达 S0, UNKNOWN 基线 Event 可双空, S2 暂冻本体待派项, 对账选中 exec.walk，封住 RA 待派项；不能虚构同时在跑的上肢抓取]
  ordering: [S0 实际范围及所有权对账先于选择取消对象, 新鲜刷新还须核对保护代际]
  forbidden_outcomes: [凭空构造阶段, 用历史上下文取消无关执行]
- id: F04b
  at_boundary: walk
  injection: 仿真姿态子句已 ARMED 后足接触消失
  expected_records: [S0 收紧, S2 收到 LOST 与 CANCEL_AFFECTED]
  ordering: [请求 SLOW 先于覆盖丢失中断]
  forbidden_outcomes: [把实机从未可用的足接触标为 LOST]
monitor_needs:
- mr: MR-01
  concern: 无意图时的跌倒
  evidence: 确定性支撑／惯性基线与 S0 回执
  d9: baseline/fall@1（其他危险依部署登记的基线硬规则）
  maximum: STOP_LATCHED
- mr: MR-04
  concern: 步态中足接触通路失效
  evidence: 仿真姿态和足接触流
  d9: generic/posture_balance@1
  maximum: SLOW
- mr: MR-03
  concern: 运动离开本阶段批准走廊
  evidence: 参考系一致的姿态、方向与扫掠区
  d9: generic/motion_envelope@1
  maximum: SLOW
- mr: MR-05
  concern: 持物滑移、载荷转移或非预期接触
  evidence: 绑定手的原始计数、指位和物手相对运动
  d9: generic/contact_force_envelope@1
  maximum: SOFT_HOLD
gap_refs: [E04, C02, M01]
