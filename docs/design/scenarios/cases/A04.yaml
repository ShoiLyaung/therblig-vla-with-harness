    phase: grasp
    gate: 站稳、L 已释放且右侧站姿抓取获准
    composition: ATOMIC
    depends_on: [stand]
    parallel_group: 无
    parent: 无
  replan_trigger: 跌倒或支撑丢失先对账；重新规划只允许合格的串行分支
