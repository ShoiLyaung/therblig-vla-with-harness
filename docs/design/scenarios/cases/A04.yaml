occupancy:
- phase: walk
  resources: E:OBSERVE、L:DRIVE
  combination: 无实机组合
  handoff: 步态结束取得 L 的 RELEASED
  envelope_policy_ref: simulation_only.walk.corridor@1
  admission: 仿真域单独受理；实机拒绝
- phase: stand
  resources: E:OBSERVE、L:MAINTAINED
  combination: 串行屏障
  handoff: 恢复运动须新准入
- phase: grasp
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: 站姿单臂准入
  handoff: 握稳转 RETENTION
checkpoints:
- phase: stand
  SUCCESS: 到达且 L 已归还、支撑稳定
  FAILED: 实测偏离路径或跌倒
  UNKNOWN: 定位中断，无法确认支撑
  recovery: 保持保护并重新测量
- phase: grasp
  SUCCESS: 站稳后确认目标在手
  FAILED: 物体确认留在原地
  UNKNOWN: 身体已停但身份不可见
  recovery: 待补证，不提交成功
context: [将仿真部署与实机的可用性分开, 视图按 boot_id 和 epoch 失效]
memory: [保留真实保护范围、恢复凭证与空窗前后的证据来源]
training:
  labels: [x.locomote, PN, G]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 仿真覆盖步态支撑流先有效后丢失
  teleoperation: 只采获准站姿上肢动作，未授权步态不采
  cross_embodiment: 可迁移上身接近；足接触来源、地面和载荷分布不能照搬
test_vectors:
- given:
  - 仿真阶段存活，重启实例尚无任何阶段记录或执行句柄。
  - 到达物件附近并在稳定站姿下抓取
  - 串行仿真行走中，仅腿轨有步态执行 exec.walk；RA 由 S0 维持，存在待派上肢项。Event 检测范围仅 L，回执实际保护 L、RA。两路送达可换序。
  when: F04a
  expected_records: [规则层直达 S0, UNKNOWN 基线 Event 可双空, S2 暂冻本体待派项, 对账选中 exec.walk，封住 RA 待派项；不能虚构同时在跑的上肢抓取]
  ordering: [S0 实际范围及所有权对账先于选择取消对象, 新鲜刷新还须核对保护代际]
  forbidden_outcomes: [凭空构造阶段, 用历史上下文取消无关执行]
  assertions:
  - alias: irq
    record_type: Event
    path: /detection/intent_status
    equals: UNKNOWN
    source: 协议
    record: irq
  - alias: fence
    record_type: 派发记录
    path: /状态
    equals: 本体待派已冻结
    source: 适配器
    record: fence
  - alias: ids
    record: irq
    source: 协议
    record_type: Event
    path: /interrupt/affected_execution_ids
    equals: []
  - alias: contexts
    record: irq
    source: 协议
    record_type: Event
    path: /detection/phase_contexts
    equals: []
  - alias: cancel
    record: irq
    source: 协议
    record_type: Event
    path: /interrupt/disposition
    equals: CANCEL_AFFECTED
  - alias: receipt
    record: applied
    source: 协议
    record_type: ProtectionReceipt
    path: /scope/resource_ids
    equals: [L, RA]
    compare_as: set
  - alias: scope_source
    record: selection
    source: 适配器
    record_type: 取消选择
    path: /依据
    equals: S0 回执实际资源与当前所有权
  - alias: selected
    record: selection
    source: 适配器
    record_type: 取消选择
    path: /执行
    equals: [exec.walk]
  - alias: receipt_cause
    source: 协议
    record_type: ProtectionReceipt
    record: applied
    path: /event_ref
    equals: event.baseline-fall-idle
  - alias: detected
    source: 协议
    record_type: Event
    record: irq
    path: /scope/resource_ids
    equals: [L]
  - alias: owners
    source: 适配器
    record_type: 当前所有权
    record: owners
    path: /腿轨执行
    equals: exec.walk
  - alias: arm_owner
    source: 适配器
    record_type: 当前所有权
    record: owners
    path: /右臂
    equals: S0 维持
  - alias: outbox
    source: 适配器
    record_type: 取消选择
    record: selection
    path: /新封锁待派资源
    equals: [RA]
  before:
  - first: irq
    then: fence
  - first: receipt
    then: selected
  - first: fence
    then: selected
  - first: owners
    then: selected
- given: [仿真支撑与足接触样本有效，姿态子句曾布防。, 到达物件附近并在稳定站姿下抓取]
  when: F04b
  expected_records: [S0 收紧, S2 收到 LOST 与 CANCEL_AFFECTED]
  ordering: [请求 SLOW 先于覆盖丢失中断]
  forbidden_outcomes: [把实机从未可用的足接触标为 LOST]
  assertions:
  - alias: slow
    record_type: 本地保护请求
    path: /level
    equals: SLOW
    source: 适配器
    record: slow
  - alias: irq
    record_type: Event
    path: /interrupt/reason_code
    equals: monitor/clause_coverage_lost
    source: 协议
    record: irq
  before:
  - first: slow
    then: irq
evidence_refs:
- policy-harness/contracts/v1/examples/monitoring-brief.locomote.json
- policy-harness/contracts/v1/examples/event.required-clause-coverage-lost.json
- policy-harness/contracts/v1/examples/event.baseline-fall-idle.json
- policy-harness/contracts/v1/examples/event.baseline-fall-unknown-intent.json
- policy-harness/contracts/v1/examples/body-profile.g1-inspire.json
protocol_checks:
- object: BodyProfile
  fields: [sensors, compatible_combinations]
  criterion: 拒绝未批准实机支撑
- object: Event
  fields: [detection, interrupt]
  criterion: 基线 UNKNOWN 时按 S0 回执选范围
- object: Execution
  fields: [core_evidence, leases]
  criterion: 核实腿轨与上身所有权
verification_boundaries:
  phases: [stand, grasp]
  terminal_success: grasp
