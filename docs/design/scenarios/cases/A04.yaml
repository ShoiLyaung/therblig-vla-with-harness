dag:
  nodes:
  - id: walk
    phase: walk
    gate: 仿真支撑输入合格且仿真运动包络已绑定；实机阻塞
    composition: ATOMIC
    depends_on: []
    parallel_group: 无
    parent: 无
  - id: stand
    phase: stand
    gate: 步态调用已终止，等待核验腿轨实际处置
    composition: BARRIER
    depends_on: [walk]
    parallel_group: 无
    parent: 无
