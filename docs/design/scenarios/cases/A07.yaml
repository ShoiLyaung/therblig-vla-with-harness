    语音: 需要但被阻塞
    惯性: 不涉及
    足接触: 不涉及
    液位与溢出: 不涉及
    材料损伤: 不涉及
    接收者承载: 需要但被阻塞
    柔性地标: 不涉及
    接口就位与扭矩: 不涉及
    可读标签: 不涉及
    动态目标轨迹: 不涉及
    外部载荷与张力: 不涉及
    工作区可见范围: 需要但被阻塞
extends_walkthrough: 独立用例
dag:
  nodes:
  - id: profile
    phase: profile
    gate: 物件已安全保持，有独立批准域供解析；本机缺该域应拒绝
    composition: S2_INTERNAL
    depends_on: []
    parallel_group: 无
    parent: 无
  - id: present
    phase: present
    gate: 仅在假设的批准域实际切入后进入
    composition: PROVIDER_COMPOSITE
    depends_on: [profile]
    parallel_group: 无
    parent: 无
  - id: wait
    phase: wait
    gate: 呈递就位且给予方仍有有效保持令牌
    composition: BARRIER
    depends_on: [present]
    parallel_group: 无
    parent: 无
  - id: release
    phase: release
    gate: 接收方身份与独立承重证据均满足，允许接管
    composition: PROVIDER_COMPOSITE
    depends_on: [wait]
    parallel_group: 无
    parent: 无
  replan_trigger: 目标人或工作区改变则撤销旧阶段并另建安全回收图
capabilities:
- name: s2.profile
  status: 内部节点
  reference: policy-harness/docs/harness-design.md
  requirements: 入口：物件已安全保持，有独立批准域供解析；本机缺该域应拒绝。退出检查：ModeStatus 与实测配置一致
- name: handover_present
  status: 需新建
  reference: 待发布
  requirements: 入口：仅在假设的批准域实际切入后进入。退出检查：接收手与物件相对位置适合交接
- name: s2.barrier
  status: 内部节点
  reference: policy-harness/docs/harness-design.md
  requirements: 入口：呈递就位且给予方仍有有效保持令牌。退出检查：接触、承载与身份都成立
- name: handover_release
  status: 需新建
  reference: 待发布
  requirements: 入口：接收方身份与独立承重证据均满足，允许接管。退出检查：接收方承载且物件未掉落
