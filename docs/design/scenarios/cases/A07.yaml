occupancy:
- phase: profile
  resources: E:OBSERVE、L:MAINTAINED、RH:MAINTAINED
  combination: 当前无此白名单 profile
  handoff: 模式申请期间保留给予方持物令牌
- phase: present
  resources: E:OBSERVE、RA:DRIVE、RH:DEPEND、L:MAINTAINED
  combination: 需批准近人站姿包络
  handoff: 持物令牌在呈递期间有效
- phase: wait
  resources: E:OBSERVE、RA:MAINTAINED、RH:MAINTAINED、L:MAINTAINED
  combination: 保持阶段无 S1 驱动
  handoff: 保留握持并核对接收者
- phase: release
  resources: E:OBSERVE、RA:DRIVE、RH:TAKEOVER、L:MAINTAINED
  combination: 需批准安全退出
  handoff: 原子接管后才开放，撤离再验证
checkpoints:
- phase: wait
  SUCCESS: 独立观察确认对方承重且身份正确
  FAILED: 对方已撤手或换人
  UNKNOWN: 手遮挡，无法区分触碰与承重
  recovery: 维持 RETENTION，等待或退回
- phase: release
  SUCCESS: 与本体分离且接收方持续持稳
  FAILED: 物件跌落或交给非目标人
  UNKNOWN: 脱离可见而接收方支撑不可见
  recovery: 核对接收方，禁止盲目再放
context: [记录指定接收者及许可区域，明确谁的语音可改目标, 入口假设物件已由 S0 安全维持，令牌与实际手、载荷和工况一致]
memory: [保留交接意图、批准修订、承接证据与实际放手时刻]
training:
  labels: [PN, H, TL, PP, UD, RL, TE]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 在仿真注入靠近、触碰、承载、撤手四种不同边界
  teleoperation: 取得近人授权后才可收集接收方同步标签
  cross_embodiment: 跨本体可复用意图与呈递方向，不能复用人体安全距离或手力标定
test_vectors:
- given: [仅在假设获批的仿真交接域内，给方仍持有物件。, 在允许的交接区域把物件交到指定接收者手中]
  when: F07
  expected_records: [保持令牌有效, Verifier 对转移不予成功, 未满足支撑守卫则不派 release]
  ordering: [确认实际接收支撑先于 TAKEOVER, 实测脱手先于提交]
  forbidden_outcomes: [用口头确认替代承载, 用模式请求直接放手]
  assertions:
  - alias: withdrawn
    record_type: 承接观测
    path: /接收手
    equals: 已撤离
    source: 适配器
    record: withdrawn
  - alias: gate
    record_type: 释放守卫
    path: /结论
    equals: 维持握持
    source: 适配器
    record: gate
  before:
  - first: withdrawn
    then: gate
evidence_refs:
- policy-harness/contracts/v1/examples/mode-request.hold.json
- policy-harness/contracts/v1/examples/observation.utterance-new-request.json
- policy-harness/contracts/v1/examples/body-profile.g1-inspire.json
protocol_checks:
- object: ModeRequest
  fields: [mode, profile_id, expected_protection_epoch]
  criterion: 白名单与实际切换分开
- object: Invocation
  fields: [bindings, handoff_refs]
  criterion: 守卫成立才可接管
- object: Result
  fields: [effects_reported, evidence]
  criterion: 脱手和接收承载均须有据
verification_boundaries:
  phases: [wait, release]
  terminal_success: release
