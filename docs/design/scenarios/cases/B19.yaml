scenario_id: B19
revision: 草案一
tier: B
title: 受推扰或人员动物闯入
baseline_refs:
  root: 67c066d
  harness: ed2eb4b
  provider: 99b37bf
  catalog: 0.2.0
  body_profile: g1-inspire@3
goal: 在任务无关的突发干扰下保持安全
success_definition: 实际保护范围、所有权及重新准入均可对账
authorization:
  status: 当前本体未授权
  scope: 外部推扰、侧后方闯入的实机硬规则检测与闭环保护
  reason: 实机惯性、足接触、侧后方点云／可视覆盖及认证语音通路未验证，不能凭视觉候选或模拟跌倒记录批准实机硬保护闭环
  would_authorize: 批准独立硬规则的感知路径、控制响应及匹配解除程序
  provenance: [DATASHEET_DECLARED, NEEDS_VALIDATION]
ambiguity: 外部推扰是 MON 事件；停后受阻才记 UD，恢复休息 R 需另有恢复模式
phases:
- id: disturb
  goal: 独立处理突然推扰或入侵
  codes: [H, UD]
  capability: 基线规则与 S0 本地保护
  s0_modes: RETENTION、PROTECTIVE
  verification: 按实际范围核实稳定；语义候选只走规则复核
  monitor_need: 摔倒、碰撞及儿童或宠物进入
  authorization: 当前本体未授权
  coverage: 需要但被阻塞
  fault_refs: [F19]
  authorization_note: 实机惯性、足接触、侧后方点云／可视覆盖及认证语音通路未验证，不能凭视觉候选或模拟跌倒记录批准实机硬保护闭环
- id: recover
  goal: 核对各原因后再恢复任务
  codes: [PN, I]
  capability: s2.reconcile（内部）
  s0_modes: BALANCE
  verification: 对应原因解除且 S0 本地检查通过
  monitor_need: 仍有重叠锁存
  authorization: 条件授权
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 仅独立核对已有保护与空载恢复入口，不证明实机扰动感知已获准
- id: rest
  goal: 已安全卸载后按任务安排主动恢复
  codes: [R]
  capability: 有界模式请求（内部工具）
  s0_modes: body.rest
  verification: 锁存逐因解除、实测空载及静稳后才受理；有持物时继续保持
  monitor_need: 新健康观测决定能否离开恢复态
  authorization: 条件授权
  coverage: 已覆盖
  fault_refs: []
  authorization_note: 仅独立核对已有保护与空载恢复入口，不证明实机扰动感知已获准
faults:
- id: F19
  at_boundary: disturb
  injection: Monitor 重启后首份刷新前发生硬规则命中的推扰
  expected_records: [Monitor 基线发中断, S2 暂冻本体待派, S0 回执决定实际影响]
  ordering: [实际保护范围和所有权先于取消选择, 匹配解除先于恢复]
  forbidden_outcomes: [无 brief 就不保护, 按无关阶段引用盲目取消]
monitor_needs:
- mr: MR-01
  concern: Monitor 重启后首份刷新前发生硬规则命中的推扰
  evidence: 独立合格的碰撞、失稳或危险区实测
  d9: baseline/fall@1（其他危险依部署登记的基线硬规则）
  maximum: STOP_LATCHED
- mr: MR-04
  concern: 支撑或载荷改变后姿态不稳
  evidence: 独立合格的惯性与支撑证据
  d9: generic/posture_balance@1
  maximum: STOP_LATCHED
- mr: MR-06
  concern: 人员或物体进入批准区域边界
  evidence: 实测空间关系或经复核的视觉发现
  d9: generic/people_workspace@1
  maximum: SOFT_HOLD
- mr: MR-08
  concern: 停止词或认证的意图纠正
  evidence: 带来源的话语及当前目标修订
  d9: 持续语音观测、认证纠正与基线停止词
  maximum: STOP_LATCHED
gap_refs: [E04, E03, M01]
coverage:
  components:
    Planner: 已覆盖
    Context: 已覆盖
    Memory: 已覆盖
    ToolInterface: 不涉及
    Resolver: 已覆盖
    Executor: 已覆盖
    Verifier: 已覆盖
    S1: 已覆盖
    S0: 已覆盖
    Monitor: 已覆盖
    Protocol: 已覆盖
    BodyProfile: 需要但被阻塞
  perception:
    头部视觉: 已覆盖
    关节位姿: 已覆盖
    手部轴向计数: 已覆盖
    电流代理: 不涉及
    深度: 不涉及
    点云: 需要但被阻塞
    语音: 需要但被阻塞
    惯性: 需要但被阻塞
    足接触: 需要但被阻塞
    液位与溢出: 不涉及
    材料损伤: 不涉及
    接收者承载: 不涉及
    柔性地标: 不涉及
    接口就位与扭矩: 不涉及
    可读标签: 不涉及
    动态目标轨迹: 不涉及
    外部载荷与张力: 不涉及
    工作区可见范围: 需要但被阻塞
protocol_checks:
- object: Event
  fields: [scope, detection]
  criterion: 基线中断只提供检测范围
- object: Execution
  fields: [core_evidence]
  criterion: 按实际保护和所有权隔离
- object: ModeRequest
  fields: [expected_protection_epoch]
  criterion: 普通请求无法清除锁存
