    RH: {label: RL, owner: S1, access: TAKEOVER, observation_mask: 按新鲜有效通道, action_mask: 接管后授权轴, missing_mask: 无效或饱和通道屏蔽}
    W: {label: 稳定, owner: S0, access: MAINTAINED, observation_mask: 按新鲜有效通道, action_mask: 屏蔽, missing_mask: 无效或饱和通道屏蔽}
    L: {label: 平衡, owner: S0, access: MAINTAINED, observation_mask: 按新鲜有效通道, action_mask: 屏蔽, missing_mask: 无效或饱和通道屏蔽}
occupancy:
- phase: open
  resources: E:OBSERVE、LA:DRIVE、LH:DRIVE、L:MAINTAINED
  combination: independent-arms-approach
  handoff: 结束后取得左臂姿态与左手扶持令牌
- phase: reach
  resources: E:OBSERVE、RA:DRIVE、L:MAINTAINED
  combination: independent-arms-approach
  handoff: 释放接近授权
- phase: get
  resources: E:OBSERVE、RA:DRIVE、RH:DRIVE、L:MAINTAINED
  combination: independent-arms
  handoff: 右手移交保持，释放右臂
- phase: join
  resources: LA:MAINTAINED、LH:MAINTAINED、RH:MAINTAINED、L:MAINTAINED、E:OBSERVE；RA 已归还，UD 标记本地空闲伺服，无前序令牌
  combination: 双侧保持
  handoff: B1 核实两左令牌与右载荷；LA 的 H(扶持) 与 LH 的拉手保持分别留证
- phase: insert
  resources: E:OBSERVE、LA:DEPEND、RA:DRIVE、LH:DEPEND、RH:DEPEND、W:DRIVE、L:MAINTAINED
  combination: insertion-with-guarded-drawer
  handoff: 注册两项左依赖及右载荷依赖
- phase: stage
  resources: E:OBSERVE、LA:DEPEND、RA:DRIVE、LH:DEPEND、RH:DEPEND、L:MAINTAINED
  combination: staging-with-guarded-drawer
  handoff: 交接期间保持驻留保护
- phase: exit
  resources: E:OBSERVE、LA:DEPEND、RA:DRIVE、LH:DEPEND、RH:TAKEOVER、L:MAINTAINED
  combination: release-with-guarded-drawer
  handoff: 清空后才解除左依赖
checkpoints:
- phase: join
  SUCCESS: 开度、物件身份、令牌和通行证据均有效
  FAILED: 明确闭合或拿错物件
  UNKNOWN: 任一令牌状态或开口不可证
  recovery: 停在屏障，核对每项依赖
- phase: exit
  SUCCESS: 区内留物且右臂已清空
  FAILED: 物件跌出或抽屉夹住右臂
  UNKNOWN: 物件被挡无法定位
  recovery: 保持扶持，安全取证
context: [缓存左右支修订与耦合扫掠区, 回弹使开度和通行证据失效]
memory: [记录屏障等待原因及各手独立证据，不把并行终态合并为同一 grant]
training:
  labels: [U, TE, G, PN, UD, H, TL, PP, RL]
  masks: [E 与 MON 无动作目标, 按实际 grant 展开轴，观测缺失另设掩码]
  simulation: 对调左右支达到屏障的顺序
  teleoperation: 保留扶持和撤出全过程的双手状态
  cross_embodiment: 单臂数据不能生成双臂耦合许可
test_vectors:
- given: [B1 双手已被本阶段维持，右力流未出现，原宽限将到期。, 左手开抽屉，右手拾物并放入]
  when: F03
  expected_records: [S0 收到 SOFT_HOLD, Event 用 brief.barrier 和 right_retention 定位, S2 隔离屏障与后继]
  ordering: [按占用起算且沿用宽限先于 GRACE_EXPIRED, 收到相关保护先于再次准入]
  forbidden_outcomes: [伪造 execution_id, 放掉左侧扶持]
  assertions:
  - alias: hold
    record_type: 本地保护请求
    path: /level
    equals: SOFT_HOLD
    source: 适配器
    record: hold
  - alias: irq
    record_type: Event
    path: /interrupt/reason_code
    equals: monitor/required_clause_unarmed
    source: 协议
    record: irq
  - alias: disposition
    record: irq
    source: 协议
    record_type: Event
    path: /interrupt/disposition
    equals: CANCEL_AFFECTED
  - alias: execs
    record: irq
    source: 协议
    record_type: Event
    path: /interrupt/affected_execution_ids
    equals: []
  - alias: node
    record: irq
    source: 协议
    record_type: Event
    path: /detection/phase_contexts/0/plan_node_id
    equals: node.join
  - alias: brief
    record: irq
    source: 协议
    record_type: Event
    path: /detection/clause_failures/0/brief_id
    equals: brief.barrier
  - alias: side
    record: irq
    source: 协议
    record_type: Event
    path: /detection/clause_failures/0/clause_id
    equals: right_retention
  - alias: missing
    record: irq
    source: 协议
    record_type: Event
    path: /detection/clause_failures/0/missing_stream_refs
    equals: [right.hand.force]
  - alias: affected
    record: irq
    source: 协议
    record_type: Event
    path: /scope/resource_ids
    equals: [RH]
  - alias: phase_brief
    source: 协议
    record_type: Event
    record: irq
    path: /detection/phase_contexts/0/brief_id
    equals: brief.barrier
  - alias: phase_clause
    source: 协议
    record_type: Event
    record: irq
    path: /detection/phase_contexts/0/clause_ids
    equals: [right_retention]
  - alias: failure
    source: 协议
    record_type: Event
    record: irq
    path: /detection/clause_failures/0/failure
    equals: GRACE_EXPIRED
  before:
  - first: hold
    then: irq
evidence_refs:
- vla-harness/contracts/v1/examples/capability.open-drawer.json
- vla-harness/contracts/v1/examples/monitoring-brief.maintain-barrier.json
- vla-harness/contracts/v1/examples/monitoring-brief.parallel-branch.json
- vla-harness/contracts/v1/examples/body-profile.g1-inspire.json
protocol_checks:
- object: Capability
  fields: [semantics, body_requirements]
  criterion: 扶持变体含两项左侧依赖
- object: Invocation
  fields: [bindings, handoff_refs]
  criterion: 逐阶段绑定保持令牌
- object: Result
  fields: [resource_dispositions]
  criterion: 实测清空后才可退出
verification_boundaries:
  phases: [join, exit]
  terminal_success: exit
